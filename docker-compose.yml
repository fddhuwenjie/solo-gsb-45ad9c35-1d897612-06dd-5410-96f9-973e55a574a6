services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SESSION_DB_PATH: /data/sessions.db
    volumes:
      - sessions-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sessions-data:
